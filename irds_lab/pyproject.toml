[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "irds-fe"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.11.1",
    "flwr-datasets[vision]>=0.3.0",
    "torch==2.2.1",
    "torchvision==0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "Mila"

[tool.flwr.app.components]
serverapp = "irds_fe.server_app:app"
clientapp = "irds_fe.client_app:app"

[tool.flwr.app.config]
# Base parameters (always present)
num-server-rounds = 200
fraction-fit = 1.0
local-epochs = 7
latent-dim = 15
hidden-dim = 512
num-supernodes = 3
learning-rate = 0.0001
batch-size = 128
gamma = 0.1
step = 20
strategy = "fedadagrad"
eta = 0.1

# Early Stopping Parameters (always present)
patience = 10
min_delta = 0.001

# Strategy-specific parameters will be added/removed dynamically by the script

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 3